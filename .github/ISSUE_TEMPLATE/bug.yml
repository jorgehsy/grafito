name: 🐛 Something is broken
description: Report a bug
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    attributes:
      label: grafito version
      placeholder: v0.2.0-alpha.1
  - type: input
    attributes:
      label: Browser and system
      placeholder: Chrome 140 on macOS
  - type: textarea
    attributes:
      label: Errors in the console or in the panel
      render: text
