name: Release

# Se dispara al subir una etiqueta de versión: `npm version ...` + `git push --follow-tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con package.json ($pkg)"; exit 1
          fi
      - run: npm run build
      - name: Empaquetar
        run: |
          name="grafito-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="$name/" -o "$name-source.tar.gz" "$GITHUB_REF_NAME"
          tar -czf "$name-web-dist.tar.gz" dist
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" grafito-*.tar.gz \
            --title "grafito $GITHUB_REF_NAME" --generate-notes $flags
