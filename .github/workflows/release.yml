name: Release

# Runs when a version tag is pushed: `git tag vX.Y.Z` + `git push --follow-tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test build
      - name: Check that the tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match package.json ($pkg)"; exit 1
          fi
      - name: Package
        run: |
          name="grafito-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="$name/" -o "$name-source.tar.gz" "$GITHUB_REF_NAME"
          tar -czf "$name-web-dist.tar.gz" apps/web/dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" grafito-*.tar.gz \
            --title "grafito $GITHUB_REF_NAME" --generate-notes $flags
